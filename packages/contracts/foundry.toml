[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./config" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/", "poseidon-solidity/=node_modules/poseidon-solidity/"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[lint]
# Style notes (immutable naming, struct field naming) are reviewed by hand; keep builds quiet.
lint_on_build = false
